name: Release

# Controlled release. Triggered ONLY by a version tag (e.g. v0.1) or a manual
# dispatch, never automatically on every push. The full CI gate runs first;
# only if it passes do we build, checksum, and publish.
#
# The `!v*-build.*` exclusion keeps this workflow away from the build tags that
# auto-release.yml creates on every merge to main. Without it, both workflows
# would publish the same commit twice and race for the same release.
on:
  push:
    tags:
      - "v*"
      - "!v*-build.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match AppInfo.version, e.g. 0.1)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Must match FLUTTER_VERSION in ci.yml: the gate below validates the code on that
# toolchain, so releasing on a different one would ship something untested.
env:
  FLUTTER_VERSION: 3.44.4

jobs:
  # Reuse the exact PR gate so a release can never ship code that would fail CI.
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, checksum, publish
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # needed to create the GitHub Release
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Drift/build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Fail closed if the tag / dispatch version does not match the release
      # version in the source. AppInfo.version is the public name ("0.1");
      # pubspec only supplies the build number, since its version field has to
      # be a three-segment semver.
      - name: Verify version matches source
        id: ver
        run: |
          set -euo pipefail
          name="$(grep -E "version = '" lib/core/constants/app_info.dart \
            | head -1 | sed -E "s/.*version = '([^']*)'.*/\1/")"
          code="$(grep -E '^version:' pubspec.yaml | sed 's/.*+//')"
          if [ "${{ github.event_name }}" = "push" ]; then
            want="${GITHUB_REF_NAME#v}"
          else
            want="${{ github.event.inputs.version }}"
          fi
          if [ "$want" != "$name" ]; then
            echo "Release version '$want' does not match AppInfo.version '$name'"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Release preflight
        run: bash scripts/release_preflight.sh "${{ steps.ver.outputs.name }}"

      # Real signing only from CI secret storage. If the keystore secrets are
      # absent the build stays UNSIGNED and is labelled as such - never
      # debug-signed, never mislabelled production.
      #
      # Keystore and properties are written OUTSIDE the checkout and found via
      # BUDGETSENSE_KEYSTORE_PROPERTIES. The Gradle build rejects a properties
      # path inside the repository, so signing material cannot be committed by
      # accident or swept into an artifact upload.
      - name: Configure signing (if secrets present)
        id: signing
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            secure_dir="${RUNNER_TEMP}/budgetsense-signing"
            mkdir -p "$secure_dir"
            chmod 700 "$secure_dir"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$secure_dir/upload-keystore.jks"
            cat > "$secure_dir/key.properties" <<EOF
          storeFile=$secure_dir/upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
            chmod 600 "$secure_dir/upload-keystore.jks" "$secure_dir/key.properties"
            echo "BUDGETSENSE_KEYSTORE_PROPERTIES=$secure_dir/key.properties" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets; producing an UNSIGNED release APK."
          fi

      - name: Build release APK
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.code }}"
          mkdir -p release-artifacts
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk \
              "release-artifacts/BudgetSense-${{ steps.ver.outputs.name }}-production.apk"
            cp build/app/outputs/flutter-apk/app-release.apk \
              "release-artifacts/BudgetSense.apk"
          else
            src="build/app/outputs/flutter-apk/app-release-unsigned.apk"
            [ -f "$src" ] || src="build/app/outputs/flutter-apk/app-release.apk"
            cp "$src" \
              "release-artifacts/BudgetSense-${{ steps.ver.outputs.name }}-release-unsigned.apk"
            cp "$src" "release-artifacts/BudgetSense.apk"
          fi

      - name: Generate checksums
        run: bash scripts/apk_checksum.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: BudgetSense ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS
